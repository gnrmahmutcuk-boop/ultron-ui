<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULTRON</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23ff1428'%3E%3Cpolygon points='3,25 17,37 23,55 11,44'/%3E%3Cpolygon points='51,33 96,3 79,32 58,43 44,53'/%3E%3Cpolygon points='8,54 26,96 33,86 49,99 67,66 91,45 61,57 46,76 33,69 25,76'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0607; --panel:#160a0d; --line:#2e1217; --red:#e0172b; --red-hi:#ff3b4d;
  --text:#f6e9eb; --muted:#a08088; --ok:#4ade80; --warn:#fbbf24;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header .logo{width:28px;height:28px}
header b{font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.22em}
header span{margin-left:auto;font-size:13px;color:var(--muted)}
header span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#feed{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.hero{margin:auto;text-align:center;max-width:300px}
.hero svg{width:150px;height:150px}
.hero h1{font:700 38px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.3em;margin:14px 0 8px;padding-left:.3em}
.hero p{margin:0;color:var(--muted)}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.step{align-self:flex-start;font-size:14px;color:var(--muted);border-left:2px solid var(--red);padding:2px 0 2px 10px}
.step.ok{color:var(--ok);border-color:var(--ok)}
.step.err{color:var(--red-hi);border-color:var(--red-hi)}
.nosteps .step:not(.err){display:none}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:11px 16px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
button{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;cursor:pointer}
button.mic{background:transparent;border:1px solid var(--line);color:var(--muted)}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.menu{background:transparent;color:var(--text);border-radius:10px}
#side{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:86%;background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:30;display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#side.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#side,#scrim{transition:none}}
#side h3{margin:0 0 4px;font-size:14px;font-weight:600;line-height:1.3;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px}
.row small{margin-left:auto;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)}
button.new{width:100%;height:46px;border-radius:10px;font-size:16px;font-weight:700}
button.opt{width:100%;height:auto;min-height:44px;padding:0 10px;border-radius:10px;background:transparent;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.sw{display:inline-block;position:relative;width:42px;height:24px;border-radius:12px;background:var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked=true] .sw{background:var(--red)}
[aria-checked=true] .sw::after{transform:translateX(18px)}
.foot{margin-top:auto;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="150 150 440 450">
    <g fill="#ff1428"><polygon points="163,260 224,313 251,391 199,345"/><polygon points="373,296 574,165 498,293 404,338 345,384"/><polygon points="186,386 263,573 297,527 365,586 447,442 550,348 419,401 352,486 296,452 258,485"/></g>
  </symbol>
</svg>

<header>
  <button class="menu" id="menu" aria-label="Menüyü aç" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <svg class="logo"><use href="#logo"/></svg>
  <b>ULTRON</b>
  <span><i></i>Demo modu</span>
</header>

<div id="scrim"></div>
<aside id="side" aria-label="Menü">
  <button class="new" id="newchat">Yeni sohbet</button>
  <section>
    <h3>Kontrolcü (demo)</h3>
    <div class="row"><i class="dot"></i>Büyük model 1<small>hazır</small></div>
  </section>
  <section>
    <h3>Çalışan modeller (demo)</h3>
    <div class="row"><i class="dot"></i>Küçük model 1<small>hazır</small></div>
    <div class="row"><i class="dot warn"></i>Küçük model 2<small>limitte</small></div>
    <div class="row"><i class="dot"></i>Küçük model 3<small>hazır</small></div>
  </section>
  <section>
    <h3>Ayarlar</h3>
    <button class="opt" id="optSteps" role="switch" aria-checked="true">Çalışma akışını göster<i class="sw"></i></button>
    <button class="opt" role="switch" aria-checked="false" disabled>Sesli cevap (yakında)<i class="sw"></i></button>
  </section>
  <p class="foot">Sürüm 0.1 demo. Gerçek modeller henüz bağlı değil.</p>
</aside>

<main id="feed">
  <div class="hero" id="hero">
    <svg><use href="#logo"/></svg>
    <h1>ULTRON</h1>
    <p>Küçük modeller çalışır, büyük modeller denetler. Bir şey yaz ve akışı gör.</p>
  </div>
</main>

<form id="f" autocomplete="off">
  <button type="button" class="mic" id="mic" aria-label="Sesli sohbet"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <input id="q" placeholder="ULTRON’a yaz…" aria-label="Mesaj">
  <button type="submit" aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
</form>

<script>
var feed=document.getElementById('feed'),hero=document.getElementById('hero'),heroEl=hero,q=document.getElementById('q'),
    side=document.getElementById('side'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu'),busy=false,sess=0;
function add(cls,text){
  if(hero){hero.remove();hero=null}
  var d=document.createElement('div');d.className=cls;d.textContent=text;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d;
}
function run(list,i,done,s){
  if(s!==sess)return;
  if(i>=list.length){done();return}
  setTimeout(function(){if(s!==sess)return;add(list[i][0],list[i][1]);run(list,i+1,done,s)},650);
}
function openSide(o){side.classList.toggle('open',o);scrim.classList.toggle('open',o);menu.setAttribute('aria-expanded',o)}
menu.addEventListener('click',function(){openSide(true)});
scrim.addEventListener('click',function(){openSide(false)});
document.getElementById('newchat').addEventListener('click',function(){
  sess++;busy=false;feed.textContent='';feed.appendChild(heroEl);hero=heroEl;openSide(false);
});
var opt=document.getElementById('optSteps');
opt.addEventListener('click',function(){
  var on=opt.getAttribute('aria-checked')!=='true';
  opt.setAttribute('aria-checked',on);document.body.classList.toggle('nosteps',!on);
});
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var t=q.value.trim();if(!t||busy)return;
  q.value='';busy=true;add('msg me',t);var s=sess;
  var fail=/hata/i.test(t);
  var steps=[
    ['step','Kontrolcü görevi parçalara böldü'],
    ['step','Küçük model 1 çalışıyor'],
    ['step','Küçük model 2 çalışıyor']
  ];
  if(fail){
    steps.push(['step err','Hata: küçük model 2 limite takıldı. Sıradaki modele geçildi.']);
    steps.push(['step','Küçük model 3 çalışıyor']);
  }
  steps.push(['step ok','Kontrolcü denetledi: sorun yok']);
  run(steps,0,function(){
    setTimeout(function(){
      if(s!==sess)return;
      add('msg ai','Bu bir demo. Gerçek yapay zeka modelleri henüz bağlı değil. Bağlandığında cevap burada görünecek.');
      busy=false;
    },500);
  },s);
});
document.getElementById('mic').addEventListener('click',function(){
  add('step','Sesli sohbet sonraki sürümde gelecek.');
});
</script>
</body>
</html>
