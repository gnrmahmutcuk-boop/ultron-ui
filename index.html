<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULTRON</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23ff1428'%3E%3Cpolygon points='3,25 17,37 23,55 11,44'/%3E%3Cpolygon points='51,33 96,3 79,32 58,43 44,53'/%3E%3Cpolygon points='8,54 26,96 33,86 49,99 67,66 91,45 61,57 46,76 33,69 25,76'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0607; --panel:#160a0d; --side:#110709; --hover:#241015; --line:#2e1217; --red:#e0172b; --red-hi:#ff3b4d;
  --text:#f6e9eb; --muted:#a08088; --ok:#4ade80; --warn:#fbbf24;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header .logo{width:28px;height:28px}
header b{font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.22em}
header span{margin-left:auto;font-size:13px;color:var(--muted)}
header span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#feed{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.hero{margin:auto;text-align:center;max-width:300px}
.hero svg{width:150px;height:150px}
.hero h1{font:700 38px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.3em;margin:14px 0 8px;padding-left:.3em}
.hero p{margin:0;color:var(--muted)}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.step{align-self:flex-start;font-size:14px;color:var(--muted);border-left:2px solid var(--red);padding:2px 0 2px 10px}
.step.ok{color:var(--ok);border-color:var(--ok)}
.step.err{color:var(--red-hi);border-color:var(--red-hi)}
.nosteps .step:not(.err){display:none}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:11px 16px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
button{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;cursor:pointer}
button.mic{background:transparent;border:1px solid var(--line);color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.menu{background:transparent;color:var(--text);border-radius:10px}
/* yan menü */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.open{opacity:1;pointer-events:auto}
#side{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:88%;background:var(--side);border-right:1px solid var(--line);
  transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:30;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
#side.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){#side,#scrim{transition:none}}
.s-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.s-top .logo{width:26px;height:26px}
.s-top b{font:700 17px/1 Georgia,"Times New Roman",serif;letter-spacing:.22em}
.s-top button{margin-left:auto;width:40px;height:40px;background:transparent;color:var(--muted);border-radius:10px}
.s-nav{padding:0 8px;display:flex;flex-direction:column;gap:2px}
button.nav{width:100%;height:auto;min-height:44px;padding:0 10px;border-radius:10px;background:transparent;color:var(--text);font-size:16px;
  display:flex;align-items:center;gap:12px;text-align:left}
button.nav:hover,button.nav[aria-expanded=true]{background:var(--hover)}
button.nav .plus{width:28px;height:28px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff}
button.nav .plus svg{width:16px;height:16px}
button.nav .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
button.nav[aria-expanded=true] .chev{transform:rotate(180deg)}
.panel{margin:2px 8px 6px 18px;padding-left:12px;border-left:1px solid var(--line)}
.panel[hidden]{display:none}
.row{display:flex;align-items:center;gap:10px;min-height:38px;font-size:15px}
.row small{margin-left:auto;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)}
button.opt{width:100%;height:auto;min-height:42px;padding:0;border-radius:8px;background:transparent;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:space-between;text-align:left}
button.opt:disabled{color:var(--muted)}
.sw{display:inline-block;position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked=true] .sw{background:var(--red)}
[aria-checked=true] .sw::after{transform:translateX(18px)}
.s-label{margin:14px 18px 4px;font-size:13px;color:var(--muted)}
.s-list{flex:1;overflow-y:auto;padding:0 8px}
button.chat{width:100%;height:auto;min-height:42px;padding:0 10px;border-radius:10px;background:transparent;color:var(--text);font-size:15px;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
button.chat:hover{background:var(--hover)}
button.chat.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--red)}
.empty{margin:8px 10px;color:var(--muted);font-size:14px}
.s-foot{display:flex;align-items:center;gap:12px;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;flex:none}
.s-foot div{line-height:1.25;min-width:0}
.s-foot small{display:block;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="150 150 440 450">
    <g fill="#ff1428"><polygon points="163,260 224,313 251,391 199,345"/><polygon points="373,296 574,165 498,293 404,338 345,384"/><polygon points="186,386 263,573 297,527 365,586 447,442 550,348 419,401 352,486 296,452 258,485"/></g>
  </symbol>
</svg>

<header>
  <button class="menu" id="menu" aria-label="Menüyü aç" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <svg class="logo"><use href="#logo"/></svg>
  <b>ULTRON</b>
  <span><i></i>Demo modu</span>
</header>

<div id="scrim"></div>
<aside id="side" aria-label="Menü">
  <div class="s-top">
    <svg class="logo"><use href="#logo"/></svg><b>ULTRON</b>
    <button id="close" aria-label="Menüyü kapat"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="s-nav">
    <button class="nav" id="newchat"><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Yeni sohbet</button>
    <button class="nav" id="tModels" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Modeller<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="panel" id="pModels" hidden>
      <div class="row"><i class="dot"></i>Büyük model 1 (kontrolcü)<small>hazır</small></div>
      <div class="row"><i class="dot"></i>Küçük model 1<small>hazır</small></div>
      <div class="row"><i class="dot warn"></i>Küçük model 2<small>limitte</small></div>
      <div class="row"><i class="dot"></i>Küçük model 3<small>hazır</small></div>
      <div class="row"><small>Örnek veri, gerçek modeller bağlı değil.</small></div>
    </div>
    <button class="nav" id="tSet" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ayarlar<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="panel" id="pSet" hidden>
      <button class="opt" id="optSteps" role="switch" aria-checked="true">Çalışma akışını göster<i class="sw"></i></button>
      <button class="opt" role="switch" aria-checked="false" disabled>Sesli cevap (yakında)<i class="sw"></i></button>
    </div>
  </nav>
  <div class="s-label">Son sohbetler</div>
  <div class="s-list" id="list"></div>
  <div class="s-foot"><span class="avatar">U</span><div><b>ULTRON</b><small>Ücretsiz, sürüm 0.1 demo</small></div></div>
</aside>

<main id="feed">
  <div class="hero" id="hero">
    <svg><use href="#logo"/></svg>
    <h1>ULTRON</h1>
    <p>Küçük modeller çalışır, büyük modeller denetler. Bir şey yaz ve akışı gör.</p>
  </div>
</main>

<form id="f" autocomplete="off">
  <button type="button" class="mic" id="mic" aria-label="Sesli sohbet"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <input id="q" placeholder="ULTRON’a yaz…" aria-label="Mesaj">
  <button type="submit" aria-label="Gönder"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
</form>

<script>
var $=function(id){return document.getElementById(id)};
var feed=$('feed'),hero=$('hero'),heroEl=hero,q=$('q'),side=$('side'),scrim=$('scrim'),menu=$('menu'),list=$('list'),
    busy=false,sess=0,cid=0,cur=null,chats=[];
function add(cls,text){
  if(hero){hero.remove();hero=null}
  var d=document.createElement('div');d.className=cls;d.textContent=text;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d;
}
function run(l,i,done,s){
  if(s!==sess)return;
  if(i>=l.length){done();return}
  setTimeout(function(){if(s!==sess)return;add(l[i][0],l[i][1]);run(l,i+1,done,s)},650);
}
function openSide(o){side.classList.toggle('open',o);scrim.classList.toggle('open',o);menu.setAttribute('aria-expanded',o)}
function saveCur(){if(cur)cur.html=feed.innerHTML}
function renderList(){
  list.textContent='';
  if(!chats.length){var e=document.createElement('p');e.className='empty';e.textContent='Henüz sohbet yok.';list.appendChild(e);return}
  chats.forEach(function(c){
    var b=document.createElement('button');b.className='chat'+(c===cur?' on':'');b.textContent=c.title;
    b.addEventListener('click',function(){saveCur();sess++;busy=false;cur=c;feed.innerHTML=c.html;hero=null;renderList();openSide(false)});
    list.appendChild(b);
  });
}
function toggle(btn,panel){
  var on=btn.getAttribute('aria-expanded')!=='true';
  btn.setAttribute('aria-expanded',on);panel.hidden=!on;
}
menu.addEventListener('click',function(){openSide(true)});
$('close').addEventListener('click',function(){openSide(false)});
scrim.addEventListener('click',function(){openSide(false)});
$('tModels').addEventListener('click',function(){toggle($('tModels'),$('pModels'))});
$('tSet').addEventListener('click',function(){toggle($('tSet'),$('pSet'))});
$('newchat').addEventListener('click',function(){
  saveCur();cur=null;sess++;busy=false;feed.textContent='';feed.appendChild(heroEl);hero=heroEl;renderList();openSide(false);
});
var opt=$('optSteps');
opt.addEventListener('click',function(){
  var on=opt.getAttribute('aria-checked')!=='true';
  opt.setAttribute('aria-checked',on);document.body.classList.toggle('nosteps',!on);
});
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  var t=q.value.trim();if(!t||busy)return;
  q.value='';busy=true;
  if(!cur){cur={id:++cid,title:t.slice(0,40),html:''};chats.unshift(cur);renderList()}
  add('msg me',t);var s=sess;
  var steps=[
    ['step','Kontrolcü görevi parçalara böldü'],
    ['step','Küçük model 1 çalışıyor'],
    ['step','Küçük model 2 çalışıyor']
  ];
  if(/hata/i.test(t)){
    steps.push(['step err','Hata: küçük model 2 limite takıldı. Sıradaki modele geçildi.']);
    steps.push(['step','Küçük model 3 çalışıyor']);
  }
  steps.push(['step ok','Kontrolcü denetledi: sorun yok']);
  run(steps,0,function(){
    setTimeout(function(){
      if(s!==sess)return;
      add('msg ai','Bu bir demo. Gerçek yapay zeka modelleri henüz bağlı değil. Bağlandığında cevap burada görünecek.');
      busy=false;
    },500);
  },s);
});
$('mic').addEventListener('click',function(){add('step','Sesli sohbet sonraki sürümde gelecek.')});
renderList();
</script>
</body>
</html>
